name: Deploy Very Three to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build-pages-redirect.py'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build new-home redirects
        run: python3 scripts/build-pages-redirect.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_redirect
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
